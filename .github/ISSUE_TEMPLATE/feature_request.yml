name: Feature request
description: Suggest something Shrike should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This fork exists for the BLAKE2b chain and the opt-in signature hash. Anything that is not specific to that is better raised [upstream](https://github.com/sparrowwallet/sparrow/issues), where it benefits far more people.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem rather than the solution. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: false
