name: Test

# Nothing ran the test suite on any runner, so every guard in it only held for whoever remembered to run it
# locally: the version comparator behind the update check, the theme parity, the artifact naming and the Windows
# ProductVersion ordering could all have been broken by a merge without anything saying so.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Set up JDK 25.0.2
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25.0.2'

      # No display is set up on purpose. The tests here are written to run without a JavaFX toolkit, and anything
      # needing one is a harness with a main method rather than a test, so a green run here says that still holds.
      - name: Run the test suite
        run: ./gradlew test drongo:test lark:test

      # Shell, so the Gradle task above does not cover them. They are what keeps every release artifact naming the
      # release it came from.
      - name: Check the release manifest rules
        run: bash .github/scripts/verify-manifest-test.sh

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/
            drongo/build/test-results/
            lark/build/test-results/
          retention-days: 7
