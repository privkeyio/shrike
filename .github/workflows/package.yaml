name: Package

on: workflow_dispatch

permissions:
  contents: read

env:
  JDK_JAVAC_OPTIONS: '-Xlint:-module'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # The secrets context cannot be read from a step-level if, so its presence is surfaced here.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
      - name: Clear Java tool-cache for reproducibility
        shell: bash
        run: rm -rf "$RUNNER_TOOL_CACHE"/Java_*
      - name: Set up JDK 25.0.2
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: '25.0.2'
      - name: Show Build Versions
        run: ./gradlew -v
      - name: Build with Gradle
        run: ./gradlew jpackage
      - name: Codesign, package and notarize macOS distribution
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' }}
        uses: sparrowwallet/github-actions/codesign-macos@6eeb7bf9b882cf89ff96b77f99bcf487b9d33992 # v1
        with:
          app-name: Shrike
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          team-id: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          notarization-password: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      - name: Package unsigned macOS distribution
        if: ${{ runner.os == 'macOS' && env.HAS_MACOS_CERT != 'true' }}
        run: |
          set -euo pipefail
          cd build/jpackage
          # hdiutil ships with macOS; create-dmg would need a brew install that is not available here.
          VERSION=$(grep -m1 "^version" ../../build.gradle | cut -d"'" -f2)
          DMG="Shrike-${VERSION}-$(uname -m)-unsigned.dmg"

          # hdiutil create intermittently fails with "Resource busy", twice in the runs behind this change and
          # on both macOS arms. It succeeds on a retry. Left unhandled it fails the build, and the checksums
          # job then writes a manifest without this platform's dmg in it.
          #
          # Detaching first because a failure can leave the volume attached, and a second create would then
          # mount alongside it at /Volumes/Shrike 1 rather than clearing what blocked the first.
          ATTEMPTS=5
          for attempt in $(seq "$ATTEMPTS"); do
            if hdiutil create -volname Shrike -srcfolder Shrike.app -ov -format UDZO "$DMG"; then
              break
            fi
            if [ "$attempt" -eq "$ATTEMPTS" ]; then
              echo "hdiutil create failed $attempt times" >&2
              exit 1
            fi
            hdiutil detach /Volumes/Shrike -force 2>/dev/null || true
            echo "hdiutil create failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done

          ls -la *.dmg
      - name: Package Windows zip distribution
        if: ${{ runner.os == 'Windows' }}
        run: ./gradlew packageZipDistribution
      - name: Package Linux tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageTarDistribution
      - name: Repackage Linux deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sparrow Build - ${{ runner.os }} ${{ runner.arch }}
          path: |
            build/jpackage/*
            !build/jpackage/Shrike/
            !build/jpackage/Shrike.app/
      - name: Headless build with Gradle
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true clean jpackage
      - name: Package Linux headless tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true packageTarDistribution
      - name: Repackage Linux headless deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh
      - name: Upload Headless Artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Sparrow Build - ${{ runner.os }} ${{ runner.arch }} Headless
          path: |
            build/jpackage/*
            !build/jpackage/Shrike/

  checksums:
    needs: build
    # Runs even where a build job failed, so that a matrix arm failing for want of codesigning secrets
    # does not skip this. That also means it can see an incomplete set of artifacts, so the manifest it
    # writes is checked for completeness below rather than published short. It stands down for a
    # cancelled run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail

          # Each artifact lands in its own subdirectory, deliberately unmerged: merging would let two
          # artifacts carrying the same filename overwrite one another without saying so.
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.msi' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.dmg' -o -name '*.pkg' \) | LC_ALL=C sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries found in any artifact" >&2
            exit 1
          fi

          # A checksum line carries a bare filename, so two files sharing one would be indistinguishable
          # to sha256sum -c. Report it rather than letting one silently stand for the other.
          # Stripping the directory in the shell rather than via xargs, whose word splitting would
          # break on the spaces in the artifact names these are downloaded into.
          duplicates=$(printf '%s\n' "${files[@]##*/}" | LC_ALL=C sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "The same filename appears in more than one artifact:" >&2
            echo "$duplicates" >&2
            exit 1
          fi

          # Hashed from each file's own directory so the name is bare, then sorted on the filename
          # field. LC_ALL=C keeps the order the same wherever this runs.
          for file in "${files[@]}"; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done | LC_ALL=C sort -k 2 > SHA256SUMS

          echo "$(wc -l < SHA256SUMS) entries"
          cat SHA256SUMS
      - name: Verify the manifest covers every platform
        shell: bash
        run: ./.github/scripts/verify-manifest.sh SHA256SUMS
      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS
